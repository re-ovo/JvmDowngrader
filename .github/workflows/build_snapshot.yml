name: Build Snapshot

on:
  push:
    branches-ignore:
      - 'feature/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 7 (fails from toolchain)
        uses: actions/setup-java@v4
        with:
          java-version: '7'
          distribution: 'zulu'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Publish
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository -Pis_local -Pversion_snapshot -Pmvn.user=${{ github.actor }} -Pmvn.key=${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: base
          path: build/libs

      - uses: actions/upload-artifact@v4
        with:
          name: api
          path: java-api/build/libs

      - uses: actions/upload-artifact@v4
        with:
          name: gradle
          path: gradle-plugin/build/libs

      - uses: actions/upload-artifact@v4
        with:
          name: test-downgrade
          path: testing/downgrade/build/libs
          
