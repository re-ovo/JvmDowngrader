name: Build

on:
  release:
    types: [ created ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 7 (fails from toolchain)
        uses: actions/setup-java@v4
        with:
          java-version: '7'
          distribution: 'zulu'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Publish
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository -Pis_local -Pmvn.user=${{ github.actor }} -Pmvn.key=${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: base
          path: build/libs

      - uses: actions/upload-artifact@v4
        with:
          name: api
          path: java-api/build/libs

      - uses: actions/upload-artifact@v4
        with:
          name: gradle
          path: gradle-plugin/build/libs

      - name: Build Site
        run: ./gradlew :site:build

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/build/libs

      - name: Load Gradle Properties
        uses: christian-draeger/read-properties@1.1.1
        id: gradle_properties
        with:
          path: './gradle.properties'
          properties: 'version'

      - name: Upload to Release
        uses: JasonEtco/upload-to-release@master
        with:
          args: ./build/libs/jvmdowngrader-${{ steps.gradle_properties.outputs.version }}-all.jar application/jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}